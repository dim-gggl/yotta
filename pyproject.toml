[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yotta"
version = "0.1.0"
description = "A modern CLI framework based on Click, Rich and Textual."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.3.1",
    "rich>=14.3.3",
    "rich-click>=1.9.7",
    "textual>=8.0.0"
]
authors = [
  { name = "Dimitri Gaggioli", email = "dimitri.gaggioli@gmail.com" },
]
license-files = ["LICENSE"]

[project.urls]
"Homepage" = "https://github.com/dim-gggl/yotta"

# C'est ici qu'on définit la commande système 'yotta'
[project.scripts]
yotta = "yotta.__main__:main"

[project.optional-dependencies]
test = ["pytest>=9.0.2", "pytest-cov>=7.0.0"]
dev = ["ruff>=0.15.2", "pytest>=9.0.2", "pytest-cov>=7.0.0"]
release = ["build>=1.4.0", "twine>=6.2.0"]

[tool.setuptools.packages.find]
include = ["yotta*"]
exclude = ["*.tests", "*.tests.*"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"yotta/ui/logo.py" = ["W291"]
"yotta/rich_ui.py" = ["F401", "F403"]
"yotta/core/types.py" = ["F811"]

[tool.pytest.ini_options]
testpaths = ["yotta"]
markers = ["integration: marks tests requiring a full project scaffold (deselect with '-m \"not integration\"')"]
